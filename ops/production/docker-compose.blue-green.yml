name: happy-release

x-happy-server: &happy-server
  env_file:
    - ${VH_PRODUCTION_ENV_FILE:-/opt/happy/.env}
  restart: unless-stopped
  stop_grace_period: 2m
  # B-827: an unrotated json log grew to 8.9 GB on happy-server-blue.
  # scripts/ci/check-log-rotation.sh refuses a deploy without max-size.
  # B-933: 50m x 5 kept ~20 min of the active slot (B-932 could not tell who
  # archived a session the evening before). 200m x 100 = 20 GB raw ≈ 26 h at
  # ~750 MB/h; rotated files are gzipped, so ~2–4 GB on disk per busy slot.
  # Sizing + rollback: docs/operations.md「Container log rotation」.
  logging:
    driver: json-file
    options:
      max-size: 200m
      compress: "true"
      max-file: "100"
  networks:
    - happy
  volumes:
    - happy-data:/data

services:
  happy-server-blue:
    <<: *happy-server
    container_name: happy-server-blue
    image: ${VH_BLUE_IMAGE}
    environment:
      VH_RELEASE_SLOT: blue
      VH_RELEASE_SHA: ${VH_BLUE_SHA}
      VH_RELEASE_ADMIN_TOKEN: ${VH_BLUE_ADMIN_TOKEN}
      METRICS_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9101"
    ports:
      - 127.0.0.1:3101:3005
      - 127.0.0.1:9101:9101

  happy-server-green:
    <<: *happy-server
    container_name: happy-server-green
    image: ${VH_GREEN_IMAGE}
    environment:
      VH_RELEASE_SLOT: green
      VH_RELEASE_SHA: ${VH_GREEN_SHA}
      VH_RELEASE_ADMIN_TOKEN: ${VH_GREEN_ADMIN_TOKEN}
      METRICS_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9102"
    ports:
      - 127.0.0.1:3102:3005
      - 127.0.0.1:9102:9102

networks:
  happy:
    external: true
    name: happy_default

volumes:
  happy-data:
    external: true
    name: happy_happy-data
