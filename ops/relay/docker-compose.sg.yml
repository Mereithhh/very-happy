services:
  relay-sg:
    image: ${RELAY_IMAGE:?RELAY_IMAGE is required}
    container_name: very-happy-relay-sg
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RELAY_ID: sg-hw
      RELAY_REGION: Singapore
      RELAY_VERSION: ${RELAY_VERSION:?RELAY_VERSION is required}
      HOST: 0.0.0.0
      PORT: "3010"
    ports:
      - 127.0.0.1:3011:3010
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
