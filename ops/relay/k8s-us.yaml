apiVersion: v1
kind: Namespace
metadata:
  name: very-happy-relay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-us
  namespace: very-happy-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-us
  template:
    metadata:
      labels:
        app: relay-us
    spec:
      containers:
        - name: relay
          image: __RELAY_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: RELAY_ID
              value: us-fb
            - name: RELAY_REGION
              value: US West
            - name: RELAY_VERSION
              value: __RELAY_VERSION__
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3010"
            - name: RELAY_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: relay-token
                  key: RELAY_TOKEN_SECRET
          ports:
            - name: http
              containerPort: 3010
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: relay-us
  namespace: very-happy-relay
spec:
  selector:
    app: relay-us
  ports:
    - name: http
      port: 3010
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay-us
  namespace: very-happy-relay
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - relay-us.veryhappy.dev
      secretName: relay-us-tls
  rules:
    - host: relay-us.veryhappy.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relay-us
                port:
                  number: 3010
