<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Very Happy — work anywhere and keep the thread</title>
  <desc id="desc">An animated terminal-style composition showing a structured conversation, real terminal, files, command palette, and mobile continuation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080c"/>
      <stop offset="0.48" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#07110f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7f6"/>
      <stop offset="0.52" stop-color="#f4f7f6"/>
      <stop offset="0.7" stop-color="#5de4ca"/>
      <stop offset="1" stop-color="#f4f7f6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34e2c4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34e2c4"/>
      <stop offset="1" stop-color="#34e2c4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#34e2c4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#34e2c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#26313a" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="workspace-clip"><rect x="437" y="77" width="688" height="372" rx="17"/></clipPath>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .packet { animation: packet 4.8s ease-in-out infinite; }
      .packet.two { animation-delay: -1.7s; }
      .packet.three { animation-delay: -3.2s; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
      .float { animation: float 5.4s ease-in-out infinite; }
      .scan { animation: scan 5.8s ease-in-out infinite; }
      .cursor { animation: blink 1.05s steps(2, jump-none) infinite; }
      .orbit { animation: orbit 18s linear infinite; transform-origin: 785px 261px; }
      @keyframes packet { 0%, 12% { opacity: 0; transform: translateX(-54px); } 35%, 64% { opacity: 1; } 88%, 100% { opacity: 0; transform: translateX(220px); } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.86); } 50% { opacity: 1; transform: scale(1.18); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes scan { 0%, 100% { opacity: 0; transform: translateY(-160px); } 25%, 70% { opacity: .5; } 88% { opacity: 0; transform: translateY(260px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .packet, .pulse, .float, .scan, .cursor, .orbit { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="25" fill="none" stroke="#26313a" stroke-width="2"/>
  <path d="M0 420C270 336 405 548 720 430C940 348 1050 359 1200 404V520H0Z" fill="#34e2c4" opacity="0.035"/>
  <rect width="1200" height="520" rx="26" fill="url(#grid)" opacity="0.42"/>
  <ellipse cx="820" cy="258" rx="380" ry="230" fill="url(#halo)"/>

  <g transform="translate(58 58)">
    <g>
      <circle cx="7" cy="7" r="5" fill="#34e2c4" filter="url(#glow)" class="pulse"/>
      <text x="23" y="11" fill="#8fa09d" font-size="12" font-weight="700" letter-spacing="2.1">OPEN AGENT WORKSPACE</text>
    </g>
    <text x="0" y="82" fill="url(#sheen)" font-size="64" font-weight="780" letter-spacing="-3.6">VERY HAPPY</text>
    <text x="1" y="122" fill="#dce5e3" font-size="22" font-weight="620">Work anywhere. Keep the thread.</text>
    <text x="1" y="155" fill="#82918f" font-size="14">Your agents keep working. Your context stays intact.</text>
    <text x="1" y="178" fill="#82918f" font-size="14">You get to be Very Happy.</text>

    <g transform="translate(0 218)">
      <rect width="147" height="34" rx="17" fill="#101820" stroke="#2e3c43"/>
      <circle cx="17" cy="17" r="4" fill="#34e2c4"/>
      <text x="30" y="21" fill="#c8d1d0" font-size="10.5" font-weight="650" letter-spacing="1">STRUCTURED</text>
      <rect x="157" width="125" height="34" rx="17" fill="#101820" stroke="#2e3c43"/>
      <circle cx="174" cy="17" r="4" fill="#34e2c4"/>
      <text x="187" y="21" fill="#c8d1d0" font-size="10.5" font-weight="650" letter-spacing="1">REAL TUI</text>
    </g>

    <g transform="translate(0 278)" class="mono">
      <text x="0" y="0" fill="#62706f" font-size="10" letter-spacing="1.5">ONE SURFACE FOR</text>
      <text x="0" y="29" fill="#d4dddb" font-size="13">Claude Code  ·  Codex</text>
      <text x="0" y="53" fill="#d4dddb" font-size="13">Gemini / OpenCode via ACP</text>
      <text x="0" y="77" fill="#d4dddb" font-size="13">OpenClaw gateway</text>
    </g>

    <g transform="translate(0 392)">
      <rect width="281" height="48" rx="10" fill="#f0f6f4"/>
      <text x="20" y="29" fill="#08110f" font-size="13" font-weight="750">OPEN THE LIVE WORKSPACE  ↗</text>
    </g>
  </g>

  <g class="orbit" opacity="0.68">
    <ellipse cx="785" cy="261" rx="342" ry="199" fill="none" stroke="#42525a" stroke-dasharray="5 12"/>
    <circle cx="443" cy="261" r="4" fill="#34e2c4" filter="url(#glow)"/>
  </g>

  <g class="float">
    <rect x="425" y="65" width="712" height="396" rx="22" fill="#0c1118" stroke="#42505a" stroke-width="1.5"/>
    <rect x="437" y="77" width="688" height="372" rx="17" fill="#080b10"/>
    <g clip-path="url(#workspace-clip)">
      <rect x="437" y="77" width="688" height="38" fill="#141b23"/>
      <circle cx="456" cy="96" r="4" fill="#5c6870"/>
      <circle cx="470" cy="96" r="4" fill="#5c6870"/>
      <circle cx="484" cy="96" r="4" fill="#34e2c4"/>
      <text x="505" y="100" fill="#cbd5d3" font-size="10.5" font-weight="680">Very Happy</text>
      <text x="1013" y="100" fill="#73817f" font-size="9" class="mono">WORKSPACE 03</text>

      <rect x="437" y="115" width="154" height="334" fill="#11171e"/>
      <path d="M591 115V449" stroke="#2a353d"/>
      <text x="454" y="140" fill="#657473" font-size="8.5" class="mono" letter-spacing="1.2">ACTIVE WORK</text>
      <rect x="445" y="151" width="138" height="52" rx="7" fill="#1a242b" stroke="#38474d"/>
      <rect x="445" y="151" width="3" height="52" rx="2" fill="#34e2c4"/>
      <text x="460" y="173" fill="#d6dfdd" font-size="10" font-weight="700">Release candidate</text>
      <text x="460" y="190" fill="#71817e" font-size="8.5" class="mono">terminal · working</text>
      <text x="460" y="227" fill="#bdc8c6" font-size="9.5">Onboarding polish</text>
      <text x="460" y="244" fill="#667572" font-size="8.5" class="mono">claude · 14m</text>
      <text x="460" y="280" fill="#bdc8c6" font-size="9.5">Security review</text>
      <circle cx="565" cy="276" r="4" fill="#34e2c4" class="pulse"/>
      <text x="460" y="297" fill="#667572" font-size="8.5" class="mono">agent · waiting</text>
      <rect x="451" y="409" width="123" height="24" rx="6" fill="#151e25" stroke="#2e3b42"/>
      <text x="464" y="425" fill="#8c9a98" font-size="8" class="mono">⌘ K  SEARCH</text>

      <rect x="592" y="115" width="348" height="334" fill="#05080c"/>
      <text x="615" y="151" fill="#34e2c4" font-size="13" class="mono">›</text>
      <text x="636" y="151" fill="#d6dfdd" font-size="11" class="mono">verify the release candidate</text>
      <text x="615" y="187" fill="#d3dcda" font-size="10" class="mono">• Auditing onboarding and mobile flows…</text>
      <text x="615" y="221" fill="#34e2c4" font-size="10" class="mono">✓</text>
      <text x="636" y="221" fill="#abb8b5" font-size="10" class="mono">structured conversation preserved</text>
      <text x="615" y="247" fill="#34e2c4" font-size="10" class="mono">✓</text>
      <text x="636" y="247" fill="#abb8b5" font-size="10" class="mono">real tmux TUI still running</text>
      <text x="615" y="273" fill="#34e2c4" font-size="10" class="mono">✓</text>
      <text x="636" y="273" fill="#abb8b5" font-size="10" class="mono">files + task state attached</text>
      <text x="615" y="319" fill="#d3dcda" font-size="10" class="mono">• Ready for review</text>
      <rect x="742" y="310" width="7" height="13" rx="1" fill="#34e2c4" class="cursor"/>
      <rect x="610" y="379" width="310" height="43" rx="8" fill="#10171d" stroke="#2c3a40"/>
      <text x="625" y="405" fill="#768582" font-size="9.5" class="mono">Type a message or return to terminal…</text>

      <rect x="940" y="115" width="185" height="334" fill="#151b22"/>
      <path d="M940 115V449" stroke="#2a353d"/>
      <text x="957" y="141" fill="#d3dcda" font-size="9.5" font-weight="680">Files</text>
      <text x="1095" y="141" fill="#778582" font-size="12">×</text>
      <rect x="950" y="153" width="165" height="25" rx="6" fill="#10161c" stroke="#303c43"/>
      <text x="960" y="169" fill="#73817f" font-size="8" class="mono">…/src/screens/public</text>
      <text x="957" y="204" fill="#34e2c4" font-size="8.5" class="mono">▾ src</text>
      <text x="972" y="227" fill="#b1bdbb" font-size="8.5" class="mono">LandingScreen.tsx</text>
      <text x="972" y="250" fill="#b1bdbb" font-size="8.5" class="mono">CommandPalette.tsx</text>
      <rect x="951" y="267" width="163" height="148" rx="7" fill="#0d1217" stroke="#2a363d"/>
      <text x="962" y="289" fill="#788784" font-size="8" class="mono">tsx</text>
      <text x="962" y="314" fill="#b9c5c2" font-size="7.8" class="mono">export function</text>
      <text x="962" y="332" fill="#34e2c4" font-size="7.8" class="mono">  WorkAnywhere() {</text>
      <text x="962" y="350" fill="#788784" font-size="7.8" class="mono">  return &lt;Thread /&gt;</text>
      <text x="962" y="368" fill="#b9c5c2" font-size="7.8" class="mono">}</text>

      <rect x="437" y="-98" width="688" height="2" fill="url(#beam)" class="scan"/>
    </g>
  </g>

  <g transform="translate(646 145)">
  <g class="float">
    <rect width="262" height="151" rx="13" fill="#10171e" stroke="#506169" stroke-width="1.2"/>
    <rect x="13" y="13" width="236" height="31" rx="7" fill="#080c10" stroke="#29373d"/>
    <text x="28" y="33" fill="#7f8e8b" font-size="9.5" class="mono">Search actions, chats, terminals…</text>
    <rect x="14" y="55" width="234" height="29" rx="6" fill="#1a272c"/>
    <rect x="14" y="55" width="3" height="29" rx="2" fill="#34e2c4"/>
    <text x="29" y="74" fill="#dbe5e2" font-size="9.5">New terminal</text>
    <text x="209" y="74" fill="#7e8d8a" font-size="8" class="mono">⌘N</text>
    <text x="29" y="103" fill="#aebbb8" font-size="9.5">Notes panel</text>
    <text x="209" y="103" fill="#687774" font-size="8" class="mono">⌘J</text>
    <text x="29" y="130" fill="#aebbb8" font-size="9.5">Release candidate</text>
  </g>
  </g>

  <g transform="translate(1000 282)">
  <g class="float">
    <rect width="143" height="211" rx="24" fill="#080c11" stroke="#627078" stroke-width="2"/>
    <rect x="9" y="10" width="125" height="191" rx="17" fill="#121920"/>
    <rect x="50" y="16" width="43" height="5" rx="3" fill="#303c43"/>
    <text x="20" y="49" fill="#d6dfdd" font-size="9" font-weight="700">Release candidate</text>
    <text x="20" y="66" fill="#6f7e7b" font-size="7.5" class="mono">STRUCTURED MIRROR</text>
    <rect x="18" y="82" width="107" height="42" rx="7" fill="#192229"/>
    <text x="27" y="99" fill="#9ca9a6" font-size="7.5">The terminal keeps</text>
    <text x="27" y="112" fill="#9ca9a6" font-size="7.5">running on your machine.</text>
    <rect x="18" y="136" width="107" height="25" rx="7" fill="#18272a" stroke="#31514e"/>
    <text x="34" y="152" fill="#77dbc7" font-size="7.5" font-weight="700">BACK TO TERMINAL</text>
    <circle cx="28" cy="181" r="4" fill="#34e2c4" class="pulse"/>
    <text x="39" y="184" fill="#879592" font-size="7" class="mono">CONTINUOUS</text>
  </g>
  </g>

  <g opacity="0.9">
    <rect x="380" y="250" width="54" height="2" fill="url(#beam)"/>
    <circle cx="390" cy="251" r="3" fill="#34e2c4" class="packet"/>
    <circle cx="390" cy="251" r="3" fill="#34e2c4" class="packet two"/>
    <circle cx="390" cy="251" r="3" fill="#34e2c4" class="packet three"/>
  </g>

  <text x="1170" y="500" fill="#53615f" font-size="8.5" text-anchor="end" class="mono" letter-spacing="1.2">SERVER-TRUSTED · OPEN SOURCE CANDIDATE</text>
</svg>
