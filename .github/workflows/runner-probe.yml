name: Runner Probe

# Cheapest possible job that proves the self-hosted runner is alive and usable.
#
# Why it exists: GitHub's billing gate ("recent account payments have failed or
# your spending limit needs to be increased") stops GITHUB-HOSTED jobs at the
# start gate — the job dies in ~2s with an empty runner_name. Whether that gate
# also blocks SELF-HOSTED jobs decides whether the whole self-hosted plan works,
# and the only way to know is to run one. Keep this around afterwards as a
# runner health check: dispatch it before blaming a workflow for "queued
# forever" (the usual cause is the runner being offline).
#
# Consumes no billable minutes: self-hosted runners are not metered.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Who am I
        run: |
          echo "runner: ${RUNNER_NAME:-?}  os: ${RUNNER_OS:-?}  arch: ${RUNNER_ARCH:-?}"
          echo "host: $(uname -a)"
          echo "cores: $(nproc)  mem: $(free -m | awk '/Mem:/{print $2"MB"}')"
          echo "disk: $(df -h "$HOME" | tail -1 | awk '{print $4" free"}')"

      - name: Toolchain present
        run: |
          for t in git node pnpm; do
            if command -v "$t" >/dev/null; then echo "$t = $($t --version 2>&1 | head -1)"; else echo "$t = MISSING"; fi
          done

      - name: Can reach GitHub + npm
        run: |
          curl -fsS -o /dev/null -w 'api.github.com %{http_code}\n' https://api.github.com/
          curl -fsS -o /dev/null -w 'registry.npmjs.org %{http_code}\n' https://registry.npmjs.org/
