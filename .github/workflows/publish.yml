name: Publish very-happy-cli

# Publishes the very-happy-cli package to npm when a tag matching v* is pushed.
# Requires repo secret NPM_TOKEN (an npm automation token with publish rights).
#
# This is a monorepo: publish the six OS/CPU tool packages first, then the
# very-happy-cli main package that references their exact version as optional
# dependencies. Never publish the main package first: fresh installs would see
# a version whose required platform artifact does not exist yet.
#
# 同一个 tag 会并行触发 cli-smoke-test.yml 的完整三系统 GitHub-hosted 矩阵——
# **刻意不做 needs 硬依赖**：保留紧急发版通道（和 deploy-hwsg 一个口径），但发完
# 要看一眼那条 run 的结果再对外宣布版本。
# setup-node 的 npm 凭据写在 $RUNNER_TEMP/.npmrc（NPM_CONFIG_USERCONFIG），是 job 级
# 的，不会写入持久化宿主机。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
          # Keep setup isolated from concurrently running smoke jobs.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The git tag is the single source of truth for the published version:
      # `git tag v0.1.1 && git push origin v0.1.1` publishes 0.1.1. On
      # workflow_dispatch (no tag) we keep whatever is in package.json.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip leading "v"; update the CLI, all platform packages, and the
          # CLI's exact optionalDependency pins together. We avoid
          # `npm version` here because npm can't parse the `workspace:*` spec
          # that pnpm uses for the bundled wire devDependency (EUNSUPPORTEDPROTOCOL).
          node -e '
            const fs = require("fs");
            const path = require("path");
            const version = process.env.VERSION.replace(/^v/, "");
            const cliFile = "packages/happy-cli/package.json";
            const cli = JSON.parse(fs.readFileSync(cliFile, "utf8"));
            cli.version = version;
            for (const name of Object.keys(cli.optionalDependencies || {})) {
              if (name.startsWith("very-happy-tools-")) cli.optionalDependencies[name] = version;
            }
            fs.writeFileSync(cliFile, JSON.stringify(cli, null, 2) + "\n");
            for (const entry of fs.readdirSync("packages/happy-cli-tools")) {
              const file = path.join("packages/happy-cli-tools", entry, "package.json");
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = version;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            }
            console.log("Set CLI and platform package versions to", version);
          '

      - name: Build very-happy-cli
        run: pnpm --filter very-happy-cli build

      # Verify the built artifact is self-contained: the bundled wire package
      # must NOT appear as an external import/require in dist. (String literals
      # such as the inlined package.json are fine; we only fail on real module
      # specifiers in import/require/from statements.)
      - name: Verify wire is bundled (no external @slopus/happy-wire import)
        run: |
          if grep -rnE "(import|require|from)[^\n]*['\"]@slopus/happy-wire['\"]" packages/happy-cli/dist; then
            echo "ERROR: dist still imports @slopus/happy-wire externally; bundle failed." >&2
            exit 1
          fi
          echo "OK: @slopus/happy-wire is inlined into dist (no external import)."

      - name: Publish platform tool packages to npm
        run: |
          set -euo pipefail
          for package_json in packages/happy-cli-tools/*/package.json; do
            package_dir=$(dirname "$package_json")
            package_name=$(node -p "require('./$package_json').name")
            package_version=$(node -p "require('./$package_json').version")
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "Already published: $package_name@$package_version"
            else
              pnpm --dir "$package_dir" publish --no-git-checks --access public
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main CLI package to npm
        # --no-git-checks because publishing from a tagged, detached state.
        # A retry after a partial platform-package publication is safe.
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./packages/happy-cli/package.json').version")
          if npm view "very-happy-cli@$package_version" version >/dev/null 2>&1; then
            echo "Already published: very-happy-cli@$package_version"
          else
            pnpm --filter very-happy-cli publish --no-git-checks --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
