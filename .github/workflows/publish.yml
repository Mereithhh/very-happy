name: Publish very-happy-cli

# Publishes the very-happy-cli package to npm when a tag matching v* is pushed.
# Requires repo secret NPM_TOKEN (an npm automation token with publish rights).
#
# This is a monorepo: we only build and publish packages/happy-cli
# (package name: very-happy-cli) via pnpm --filter.
#
# 2026-08-14：跑在 fb-us self-hosted runner 上（0 计费分钟）。同一个 tag 会并行
# 触发 cli-smoke-test.yml 的完整三系统矩阵（macOS/Windows 托管 + Linux self-hosted）——
# **刻意不做 needs 硬依赖**：保留紧急发版通道（和 deploy-hwsg 一个口径），但发完
# 要看一眼那条 run 的结果再对外宣布版本。
# setup-node 的 npm 凭据写在 $RUNNER_TEMP/.npmrc（NPM_CONFIG_USERCONFIG），是 job 级
# 的，不会在 self-hosted 的 HOME 里留下 token。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # 降级：`gh variable set LINUX_RUNNER --body '["ubuntu-latest"]'`（见 PROCESS.md §4）。
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        # clean=true（默认）：self-hosted 工作目录复用；上一次 run 改过的
        # packages/happy-cli/package.json 版本号会在这里被 reset 掉。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ⚠️ setup-node 先于 pnpm/action-setup：后者默认要用现成的 node/npm 装 pnpm，
      # self-hosted 上不能假设系统装了 node。不用 `cache: pnpm`（那要求反过来的顺序），
      # self-hosted 靠本地持久化 pnpm store。
      - name: Setup Node
        uses: actions/setup-node@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
          # dest 必须按 job 隔离：3 个 runner 实例共享同一个 HOME（同一个 runner
          # 用户），而这个 action 默认装到固定的 `~/setup-pnpm`。并发 job（tag 时
          # publish 与两格 smoke 同时跑）会互相删掉对方正 cd 着的目录，症状是
          # `ENOENT: process.cwd failed ... directory was likely removed`
          # （2026-08-14 v0.2.38 发版实锤：node20 格过、node24 格挂）。
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install dependencies
        # electron（packages/codium 桌面 spike）的 postinstall 下 ~100MB 二进制，
        # 发 cli 用不到，是已知抖动源 → 跳二进制。
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      # The git tag is the single source of truth for the published version:
      # `git tag v0.1.1 && git push origin v0.1.1` publishes 0.1.1. On
      # workflow_dispatch (no tag) we keep whatever is in package.json.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip leading "v"; write package.json directly with node. We avoid
          # `npm version` here because npm can't parse the `workspace:*` spec
          # that pnpm uses for the bundled wire devDependency (EUNSUPPORTEDPROTOCOL).
          node -e '
            const fs = require("fs");
            const f = "packages/happy-cli/package.json";
            const p = JSON.parse(fs.readFileSync(f, "utf8"));
            p.version = process.env.VERSION.replace(/^v/, "");
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            console.log("Set version to", p.version);
          '

      - name: Build very-happy-cli
        run: pnpm --filter very-happy-cli build

      # Verify the built artifact is self-contained: the bundled wire package
      # must NOT appear as an external import/require in dist. (String literals
      # such as the inlined package.json are fine; we only fail on real module
      # specifiers in import/require/from statements.)
      - name: Verify wire is bundled (no external @slopus/happy-wire import)
        run: |
          if grep -rnE "(import|require|from)[^\n]*['\"]@slopus/happy-wire['\"]" packages/happy-cli/dist; then
            echo "ERROR: dist still imports @slopus/happy-wire externally; bundle failed." >&2
            exit 1
          fi
          echo "OK: @slopus/happy-wire is inlined into dist (no external import)."

      - name: Publish to npm
        # --no-git-checks because publishing from a tagged, detached state.
        # Provenance is optional; drop it if your org disallows it.
        run: pnpm --filter very-happy-cli publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
