name: Publish very-happy-cli

# Publishes the very-happy-cli package to npm when a tag matching v* is pushed.
# Requires repo secret NPM_TOKEN (an npm automation token with publish rights).
#
# This is a monorepo: publish the six OS/CPU tool packages first, then the
# very-happy-cli main package that references their exact version as optional
# dependencies. Never publish the main package first: fresh installs would see
# a version whose required platform artifact does not exist yet.
#
# 同一个 tag 会并行触发 cli-smoke-test.yml 的完整三系统 GitHub-hosted 矩阵——
# **刻意不做 needs 硬依赖**：保留紧急发版通道（和 deploy-hwsg 一个口径），但发完
# 要看一眼那条 run 的结果再对外宣布版本。
# setup-node 的 npm 凭据写在 $RUNNER_TEMP/.npmrc（NPM_CONFIG_USERCONFIG），是 job 级
# 的，不会写入持久化宿主机。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fail before anything is published: CLI feat/fix/perf commits since the
      # previous v* tag need a CHANGELOG_RELEASES entry with this exact
      # cliVersion. A failed tag costs a version number (tags are immutable),
      # so the release skill runs the same check locally before tagging. The
      # audited escape hatch is an annotated tag whose message contains
      # `[changelog-skip: <reason>]`.
      - name: Gate - changelog covers this CLI release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --quiet --unshallow origin
          fi
          git fetch --quiet --tags --force origin
          node scripts/changelog/check-release.mjs --mode cli --version "$VERSION"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
          # Keep setup isolated from concurrently running smoke jobs.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The git tag is the single source of truth for the published version:
      # `git tag v0.1.1 && git push origin v0.1.1` publishes 0.1.1. On
      # workflow_dispatch (no tag) we keep whatever is in package.json.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip leading "v"; update the CLI, all platform packages, and the
          # CLI's exact optionalDependency pins together. We avoid
          # `npm version` here because npm can't parse the `workspace:*` spec
          # that pnpm uses for the bundled wire devDependency (EUNSUPPORTEDPROTOCOL).
          node -e '
            const fs = require("fs");
            const path = require("path");
            const version = process.env.VERSION.replace(/^v/, "");
            const cliFile = "packages/happy-cli/package.json";
            const cli = JSON.parse(fs.readFileSync(cliFile, "utf8"));
            cli.version = version;
            for (const name of Object.keys(cli.optionalDependencies || {})) {
              if (name.startsWith("very-happy-tools-")) cli.optionalDependencies[name] = version;
            }
            fs.writeFileSync(cliFile, JSON.stringify(cli, null, 2) + "\n");
            for (const entry of fs.readdirSync("packages/happy-cli-tools")) {
              const file = path.join("packages/happy-cli-tools", entry, "package.json");
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = version;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            }
            console.log("Set CLI and platform package versions to", version);
          '

      - name: Build very-happy-cli
        run: pnpm --filter very-happy-cli build

      # Verify the built artifact is self-contained: the bundled wire package
      # must NOT appear as an external import/require in dist. (String literals
      # such as the inlined package.json are fine; we only fail on real module
      # specifiers in import/require/from statements.)
      - name: Verify wire is bundled (no external @slopus/happy-wire import)
        run: |
          if grep -rnE "(import|require|from)[^\n]*['\"]@slopus/happy-wire['\"]" packages/happy-cli/dist; then
            echo "ERROR: dist still imports @slopus/happy-wire externally; bundle failed." >&2
            exit 1
          fi
          echo "OK: @slopus/happy-wire is inlined into dist (no external import)."

      - name: Publish platform tool packages to npm
        run: |
          set -euo pipefail
          for package_json in packages/happy-cli-tools/*/package.json; do
            package_dir=$(dirname "$package_json")
            package_name=$(node -p "require('./$package_json').name")
            package_version=$(node -p "require('./$package_json').version")
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "Already published: $package_name@$package_version"
            else
              # npm/pnpm reject publishing a package whose os/cpu metadata does
              # not match the runner. Packing first makes the publish input a
              # platform-neutral tarball while preserving that metadata for
              # consumers during install.
              npm pack "$package_dir" --pack-destination "$RUNNER_TEMP"
              npm publish "$RUNNER_TEMP/${package_name}-${package_version}.tgz" --access public
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main CLI package to npm
        # --no-git-checks because publishing from a tagged, detached state.
        # A retry after a partial platform-package publication is safe.
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./packages/happy-cli/package.json').version")
          if npm view "very-happy-cli@$package_version" version >/dev/null 2>&1; then
            echo "Already published: very-happy-cli@$package_version"
          else
            # Keep the explicit relative-path prefix: without `./`, npm treats
            # `packages/happy-cli` as a GitHub shorthand and tries to clone
            # git@github.com/packages/happy-cli.git instead of packing the
            # checked-out workspace directory.
            npm pack ./packages/happy-cli --pack-destination "$RUNNER_TEMP"
            # --tag next, NOT latest (B-348). `latest` is what the relay
            # advertises as `recommendedVersion` once
            # CLI_VERSION_REGISTRY_LOOKUP is on, and B-327's auto-update
            # installs exactly that — so `latest` has to mean "the 3-OS smoke
            # matrix went green", not "npm accepted the tarball". The `promote`
            # job below moves it. Publishing itself stays unconditional and
            # unblocked: the emergency channel above is untouched, only the
            # fleet-wide recommendation waits.
            npm publish "$RUNNER_TEMP/very-happy-cli-${package_version}.tgz" --access public --tag next
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Promote `next` → `latest` once the smoke matrix is green (B-348) ───────
  # Deliberately a separate job that `needs: publish` — NOT a `needs:` on the
  # smoke workflow, and NOT a `workflow_run` trigger (banned repo-wide by
  # scripts/ci/check-public-pr-isolation.mjs: a privileged trigger must never be
  # able to run fork code). It polls the smoke runs for this very commit.
  #
  # Failing this job never un-publishes anything and never moves `latest`: the
  # version stays on `next`, installable by exact version, and the fleet simply
  # is not told to take it. That is the intended failure mode.
  promote:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # read-only, and only to poll this repo's own run conclusions
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Wait for the CLI smoke matrix on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 35 * 60 ))
          while :; do
            runs=$(gh run list --workflow=cli-smoke-test.yml --commit="$SHA"                      --json status,conclusion,databaseId,event --limit 20)
            # Only push-triggered runs: a manual dispatch may be Linux-only.
            pending=$(node -e '
              const rs = JSON.parse(process.argv[1]).filter((r) => r.event === "push");
              process.stdout.write(String(rs.length === 0 ? 1 : rs.filter((r) => r.status !== "completed").length));
            ' "$runs")
            if [ "$pending" = 0 ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::smoke runs for $SHA did not finish in time; the dist-tag is left untouched" >&2
              exit 1
            fi
            echo "waiting for smoke ($pending run(s) not finished)"
            sleep 30
          done
          node -e '
            const rs = JSON.parse(process.argv[1]).filter((r) => r.event === "push");
            const bad = rs.filter((r) => r.conclusion !== "success");
            for (const r of rs) console.log(`run ${r.databaseId} ${r.conclusion}`);
            if (bad.length) { console.error("::error::smoke did not pass; not promoting to latest"); process.exit(1); }
          ' "$(gh run list --workflow=cli-smoke-test.yml --commit="$SHA" --json status,conclusion,databaseId,event --limit 20)"

      - name: Promote to latest (never backwards, idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          current=$(npm view very-happy-cli version 2>/dev/null || echo '')
          echo "npm latest=${current:-<none>} candidate=$version"
          if [ "$current" = "$version" ]; then
            echo "already latest; nothing to do"
            exit 0
          fi
          # A re-run of an old tag must never drag the fleet back. B-329 fixed
          # the same class of bug on the daemon side; the registry side needs
          # the guard too, because `dist-tag add` happily moves backwards.
          # Compared in plain node: this job installs no dependencies, so there
          # is no `semver` to call, and every version we publish is strict X.Y.Z.
          if [ -n "$current" ]; then
            node -e '
              const parse = (v) => {
                const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(v);
                if (!m) { console.error(`::error::not a strict X.Y.Z version: ${v}`); process.exit(1); }
                return m.slice(1).map(Number);
              };
              const [candidate, current] = [parse(process.argv[1]), parse(process.argv[2])];
              let cmp = 0;
              for (let i = 0; i < 3; i += 1) {
                if (candidate[i] !== current[i]) { cmp = candidate[i] > current[i] ? 1 : -1; break; }
              }
              if (cmp <= 0) {
                console.error(`::error::${process.argv[1]} is not newer than the current latest ${process.argv[2]}; refusing to move the dist-tag backwards`);
                process.exit(1);
              }
            ' "$version" "$current"
          fi
          npm dist-tag add "very-happy-cli@$version" latest
          npm view very-happy-cli version

      # B-348: publishing tells nobody — the update surfaces read the relay's
      # recommendation. This runs AFTER the promotion (not next to the publish
      # step, where it would fire on every single release: the relay follows the
      # dist-tag with a one-hour cache, so "not yet" is normal there). Reports
      # rather than fails: holding a release back is legitimate, and a red X on
      # a successful publish teaches people to ignore red Xs.
      - name: Check the relay will recommend what was just published
        if: always()
        run: node scripts/release/check-recommended.mjs "${VERSION#v}"
        env:
          VH_PUBLIC_ORIGIN: https://veryhappy.dev
          VERSION: ${{ github.ref_name }}
