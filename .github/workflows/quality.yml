name: Quality Gates

# 质量门禁（docs/PROCESS.md §3 的 CI 落地）——push main + 所有 PR 必跑。
#
# 所有常态门禁固定使用 GitHub 托管的临时 runner。公开 PR、main push 和手动运行
# 都不会进入 Owner 的私有基础设施。各包合并在一个 gates job 中以复用依赖装配；
# 每个 gate 使用独立 step，一个失败不会阻止其他 gate 报告结果。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (introduced commits)
    # The downloaded scanner is version- and SHA256-pinned in scan-secrets.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan commits introduced by this event
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/scan-secrets.sh --ci

  server-container-smoke:
    name: server container / migration / persistence
    # The private Linux runner intentionally has no Docker socket. Run this on
    # public PRs only, on GitHub-hosted capacity: fork code never reaches a
    # private runner, while trusted main pushes use the locally verified image.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/ci/smoke-server-container.sh
      - name: Gate - blue-green release state machine
        run: bash scripts/ci/test-blue-green-state-machine.sh
      # B-348: needs the tags, which the default shallow checkout omits.
      - name: Fetch release tags
        run: git fetch --tags --force --depth=1 origin
      - name: Gate - changelog cliVersion is not invented
        run: node scripts/release/check-changelog-versions.mjs

  gates:
    name: quality gates (wire / server / web-v2 / cli)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify public PR and release contracts
        run: |
          node scripts/ci/check-public-pr-isolation.mjs
          node scripts/ci/check-trust-model.mjs
          node --test scripts/changelog/generate-draft.test.mjs
          node --test scripts/changelog/check-release.test.mjs

      # ⚠️ 顺序：setup-node 在 pnpm/action-setup **之前**。pnpm/action-setup 默认要用
      # 现成的 node/npm 装 pnpm（README: "This action does not setup Node.js for you"），
      # self-hosted 上不能假设系统有 node；setup-node 自己只用 runner 内置 node 就能跑，
      # 所以先它、后 pnpm 才是零假设的顺序。（这个顺序的代价是不能用 setup-node 的
      # `cache: pnpm`——它要先有 pnpm 才能问出 store 路径；我们本来就不要 GitHub 缓存。）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # 不写 version：pnpm/action-setup 读根 package.json 的 packageManager 字段
      # （pnpm@10.11.0），单一事实源，升级 pnpm 只改 packageManager 即可。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # dest 必须按 job 隔离：3 个 runner 实例共享同一个 HOME（同一个 runner
          # 用户），而这个 action 默认装到固定的 `~/setup-pnpm`。并发 job（tag 时
          # publish 与两格 smoke 同时跑）会互相删掉对方正 cd 着的目录，症状是
          # `ENOENT: process.cwd failed ... directory was likely removed`
          # （2026-08-14 v0.2.38 发版实锤：node20 格过、node24 格挂）。
          dest: ${{ runner.temp }}/setup-pnpm

      # ── 装配（失败则后面全部 gate 跳过）───────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 后续所有包都 import @slopus/happy-wire 的 dist（gitignored），必须先建。
      - name: Build happy-wire (dependency dist)
        id: deps
        run: pnpm --filter @slopus/happy-wire build

      # ── 门禁（互不阻挡，全部跑完；任一失败 → job 失败）─────────────────
      - name: 'Gate: happy-wire tests'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter @slopus/happy-wire exec vitest run

      - name: 'Gate: happy-server typecheck (tsc --noEmit)'
        # postinstall 已跑过 prisma generate（tsc/vitest 需要生成的 client 类型）。
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter very-happy-server --fail-if-no-match typecheck

      - name: 'Gate: happy-server tests'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter very-happy-server --fail-if-no-match exec vitest run

      # 硬门：存量 tsc 债 2026-08-13 清零（492→0），0 错误是红线。
      - name: 'Gate: happy-web-v2 typecheck (tsc --noEmit)'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter @slopus/happy-web-v2 typecheck

      - name: 'Gate: happy-web-v2 tests'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter @slopus/happy-web-v2 exec vitest run

      # 刻意不用 `pnpm --filter @slopus/happy-web-v2 build`：那个 script 是
      # `tsc -b && vite build`；门禁口径（PROCESS.md §3）是 vite build 成功 +
      # typecheck 单独成门（上一个 step），两者分开报错更好定位。
      - name: 'Gate: happy-web-v2 vite build'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter @slopus/happy-web-v2 exec vite build

      # build 内含 tsc --noEmit（cli 的 tsc 是干净的，硬门）+ pkgroll 打包。
      - name: 'Gate: happy-cli build (含 tsc --noEmit)'
        id: cli_build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter very-happy-cli build

      # 只跑 unit 项目。vitest.config.ts 里 integration-empty / integration-plan-mode /
      # integration-authenticated 三个项目要起真 daemon / 真 Claude 二进制，CI 上不跑
      # （其中 daemon.integration "second daemon" 在本地也是已知环境例外）。
      - name: 'Gate: happy-cli unit tests'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter very-happy-cli exec vitest run --project unit

      # 运行冒烟：build 绿 ≠ 运行不崩（CJS/ESM 装配有过事故先例）。
      # HAPPY_HOME_DIR 指到 job 级 temp：self-hosted 上别把状态写进 runner 的 ~/.happy。
      - name: 'Gate: happy-cli runtime smoke (node dist/index.mjs --version)'
        if: ${{ !cancelled() && steps.cli_build.outcome == 'success' }}
        env:
          HAPPY_HOME_DIR: ${{ runner.temp }}/happy-home
        run: node packages/happy-cli/dist/index.mjs --version
