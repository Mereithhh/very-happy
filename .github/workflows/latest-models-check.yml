name: Latest models check

# B-844: fail when the npm `latest` Codex bundles a flagship (sol) model newer
# than packages/happy-wire/src/latestModels.json, so "follow latest" never
# silently goes stale. Claude is covered by happy-cli's
# latestModelsFreshness.test.ts on every PR (bundled claude-agent-sdk).

on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:
    inputs:
      codex_version:
        description: 'Codex version to probe (default: npm latest)'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Probe Codex model/list against the latest-models table
        env:
          CODEX_VERSION: ${{ inputs.codex_version || 'latest' }}
        run: node scripts/dev/check-latest-models.mjs --codex-version "$CODEX_VERSION"
