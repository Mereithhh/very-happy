name: Deploy production

# Manual production deploy of one complete server + Web image over SSH.
# Never runs automatically — you trigger it from the Actions
# tab or `gh workflow run deploy-hwsg.yml -f target=all`.
#
# 惯例：先等目标 commit 的 quality.yml（Quality Gates）跑绿再触发本 deploy
# （核对：`gh run list --workflow=quality.yml --commit=<sha>`）。这里刻意
# **不做硬依赖**——保留应急直发通道（quality 挂了但要紧急回滚/热修时仍可发），
# 但常态下跳过 quality 直发视为违规操作。
#
# Requires repo secrets: HWSG_SSH_KEY (private key), HWSG_HOST, HWSG_PORT,
# HWSG_USER. The legacy HWSG_* names now identify the active production host.
# The matching public key is installed on that host. The private key is written
# only to the GitHub-hosted job's runner.temp and removed in the final step.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, web, server, publish]
        default: all
      rollout:
        description: Blue-green rollout phase
        type: choice
        options: [switch, shadow, groundwork]
        default: switch

concurrency:
  group: deploy-hwsg
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SERVER_TAG: ghcr.io/mereithhh/very-happy-server:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preflight
        run: |
          test "$GITHUB_REF" = refs/heads/main
          missing=
          for c in ssh ssh-keyscan tar curl git; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "ERROR: runner 缺少必需命令:$missing" >&2
            exit 1
          fi
          echo "OK: ssh/ssh-keyscan/tar/curl/git 都在 ($(uname -a))"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push complete server image
        id: server_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ env.SERVER_TAG }}
          build-args: VH_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Set up SSH
        if: inputs.target != 'publish'
        # 私钥只落在 job 级 runner.temp；known_hosts 的 keyscan 只是预热，
        # 脚本仍用 StrictHostKeyChecking=accept-new 兜底。
        run: |
          umask 077
          printf '%s\n' "${{ secrets.HWSG_SSH_KEY }}" > "${{ runner.temp }}/hwsg_key"
          chmod 600 "${{ runner.temp }}/hwsg_key"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.HWSG_PORT }}" -H "${{ secrets.HWSG_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy
        if: inputs.target != 'publish'
        env:
          HWSG_HOST: ${{ secrets.HWSG_HOST }}
          HWSG_PORT: ${{ secrets.HWSG_PORT }}
          HWSG_USER: ${{ secrets.HWSG_USER }}
          SSH_KEY: ${{ runner.temp }}/hwsg_key
          SERVER_IMAGE: ghcr.io/mereithhh/very-happy-server@${{ steps.server_build.outputs.digest }}
          ROLLOUT_MODE: ${{ inputs.rollout }}
        run: |
          chmod +x scripts/ci/deploy-hwsg.sh
          ./scripts/ci/deploy-hwsg.sh "${{ inputs.target }}" "$ROLLOUT_MODE"

      - name: Promote verified image to latest
        if: inputs.target != 'publish' && inputs.rollout != 'shadow'
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/mereithhh/very-happy-server:latest
          ghcr.io/mereithhh/very-happy-server@${{ steps.server_build.outputs.digest }}

      - name: Cleanup SSH key
        if: always() && inputs.target != 'publish'
        run: rm -f "${{ runner.temp }}/hwsg_key"
