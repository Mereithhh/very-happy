name: Deploy production

# Manual (deliberate) production deploy of the web app and/or server over SSH.
# Never runs automatically — you trigger it from the Actions
# tab or `gh workflow run deploy-hwsg.yml -f target=all`.
#
# 惯例：先等目标 commit 的 quality.yml（Quality Gates）跑绿再触发本 deploy
# （核对：`gh run list --workflow=quality.yml --commit=<sha>`）。这里刻意
# **不做硬依赖**——保留应急直发通道（quality 挂了但要紧急回滚/热修时仍可发），
# 但常态下跳过 quality 直发视为违规操作。
#
# Requires repo secrets: HWSG_SSH_KEY (private key), HWSG_HOST, HWSG_PORT,
# HWSG_USER. The legacy HWSG_* names now identify the active production host.
# The matching public key is installed on that host. The private key is written
# only to the GitHub-hosted job's runner.temp and removed in the final step.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, web, server]
        default: all

concurrency:
  group: deploy-hwsg
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preflight
        run: |
          missing=
          for c in ssh ssh-keyscan tar curl git; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "ERROR: runner 缺少必需命令:$missing" >&2
            exit 1
          fi
          echo "OK: ssh/ssh-keyscan/tar/curl/git 都在 ($(uname -a))"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
          # dest 必须按 job 隔离：3 个 runner 实例共享同一个 HOME（同一个 runner
          # 用户），而这个 action 默认装到固定的 `~/setup-pnpm`。并发 job（tag 时
          # publish 与两格 smoke 同时跑）会互相删掉对方正 cd 着的目录，症状是
          # `ENOENT: process.cwd failed ... directory was likely removed`
          # （2026-08-14 v0.2.38 发版实锤：node20 格过、node24 格挂）。
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up SSH
        # 私钥只落在 job 级 runner.temp；known_hosts 的 keyscan 只是预热，
        # 脚本仍用 StrictHostKeyChecking=accept-new 兜底。
        run: |
          umask 077
          printf '%s\n' "${{ secrets.HWSG_SSH_KEY }}" > "${{ runner.temp }}/hwsg_key"
          chmod 600 "${{ runner.temp }}/hwsg_key"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.HWSG_PORT }}" -H "${{ secrets.HWSG_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy
        env:
          HWSG_HOST: ${{ secrets.HWSG_HOST }}
          HWSG_PORT: ${{ secrets.HWSG_PORT }}
          HWSG_USER: ${{ secrets.HWSG_USER }}
          SSH_KEY: ${{ runner.temp }}/hwsg_key
        run: |
          chmod +x scripts/ci/deploy-hwsg.sh
          ./scripts/ci/deploy-hwsg.sh "${{ inputs.target }}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f "${{ runner.temp }}/hwsg_key"
