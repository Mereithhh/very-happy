name: CLI Smoke Test

# Builds, packs and globally installs very-happy-cli, then runs the binary's
# basic subcommands. Cross-platform because the postinstall step resolves the
# matching optional OS/CPU package and unpacks only its binaries — we want to
# catch a broken package selection/install on Linux/macOS/Windows before publish.
#
# 公开仓库不把 CI 连接到生产宿主机：三个平台均使用 GitHub 托管的临时 runner。
# Linux 在每个相关 main push/PR 上运行；macOS 在 tag 或手动完整冒烟时运行；
# Windows 保留为手动完整冒烟，避免普通 PR 的额外时延。
#
# 注：`paths` 过滤器对 **tag push 不生效**（GitHub 文档明文："Path filters are not
# evaluated for pushes of tags."），所以打 tag 一定会触发本 workflow，不会被 paths 吃掉。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'packages/happy-cli/**'
      - 'packages/happy-cli-tools/**'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/happy-cli/**'
      - 'packages/happy-cli-tools/**'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:
    inputs:
      cross_platform:
        description: 同时跑 macOS + Windows（会消耗托管分钟，约 96 分钟额度）
        type: boolean
        default: false

concurrency:
  group: cli-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── 常态档：Linux only，始终使用 GitHub 托管 runner ─────────────────────
  smoke-linux:
    name: smoke (linux, node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        # 默认 clean=true（git clean -ffdx + reset）。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 先固定 Node，再安装 pnpm，避免依赖 runner 的预装版本。
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
          # dest 必须按 job 隔离：3 个 runner 实例共享同一个 HOME（同一个 runner
          # 用户），而这个 action 默认装到固定的 `~/setup-pnpm`。并发 job（tag 时
          # publish 与两格 smoke 同时跑）会互相删掉对方正 cd 着的目录，症状是
          # `ENOENT: process.cwd failed ... directory was likely removed`
          # （2026-08-14 v0.2.38 发版实锤：node20 格过、node24 格挂）。
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build very-happy-cli
        run: pnpm --filter very-happy-cli build

      - name: Verify wire is bundled (no external @slopus/happy-wire import)
        shell: bash
        run: |
          if grep -rnE "(import|require|from)[^\n]*['\"]@slopus/happy-wire['\"]" packages/happy-cli/dist; then
            echo "ERROR: dist still imports @slopus/happy-wire externally; bundle failed." >&2
            exit 1
          fi
          echo "OK: @slopus/happy-wire is inlined into dist."

      - name: Pack + global install (runs postinstall on this platform)
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_NAME=$(node -e "process.stdout.write(require('./packages/happy-cli/scripts/unpack-tools.cjs').getPlatformPackageName())")
          pnpm --filter "$TOOLS_NAME" pack --pack-destination packages/happy-cli
          pnpm --filter very-happy-cli pack --pack-destination packages/happy-cli
          TOOLS_PKG=$(ls packages/happy-cli/"$TOOLS_NAME"-*.tgz)
          CLI_PKG=$(ls packages/happy-cli/very-happy-cli-*.tgz)
          CLI_BYTES=$(wc -c < "$CLI_PKG")
          test "$CLI_BYTES" -lt 10000000 || { echo "FAIL: main CLI tarball is $CLI_BYTES bytes"; exit 1; }
          npm install -g "./$TOOLS_PKG" "./$CLI_PKG"

      - name: Run very-happy subcommands
        shell: bash
        # HAPPY_HOME_DIR 指到 job 级 temp：self-hosted 的 HOME 是复用的，别把
        # ~/.happy 状态留在 runner 上（也让每次冒烟都是"首次运行"语义）。
        env:
          HAPPY_HOME_DIR: ${{ runner.temp }}/happy-home
        run: |
          # macOS runner 没有 GNU `timeout`（历史上 macOS 两个矩阵格子因此秒挂），
          # 用 perl alarm 做等价 shim；ubuntu/windows(git-bash) 自带 timeout 不受影响。
          if ! command -v timeout >/dev/null 2>&1; then
            timeout() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          fi
          echo "very-happy --version"
          timeout 30 very-happy --version || { echo "FAIL: --version"; exit 1; }
          echo "very-happy --help"
          timeout 30 very-happy --help || { echo "FAIL: --help"; exit 1; }
          echo "very-happy doctor"
          timeout 60 very-happy doctor || { echo "FAIL: doctor"; exit 1; }
          echo "Smoke test passed on linux (node ${{ matrix.node-version }})"

      - name: Cleanup global install
        # self-hosted 上 `npm install -g` 的残留会一直留在 runner 里，且下一次
        # 冒烟就不再是"干净安装"。托管 runner 上这步是无害 no-op。
        if: always()
        shell: bash
        run: |
          TOOLS_NAME=$(node -e "process.stdout.write(require('./packages/happy-cli/scripts/unpack-tools.cjs').getPlatformPackageName())")
          npm uninstall -g very-happy-cli "$TOOLS_NAME" || true

  # ── 发版档 macOS：打 tag / 手动完整冒烟时跑 GitHub 托管 macOS ─────────
  smoke-macos:
    name: smoke (macos-14, node ${{ matrix.node-version }})
    if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.cross_platform) && vars.SKIP_HOSTED_SMOKE != '1' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
          # dest 必须按 job 隔离：3 个 runner 实例共享同一个 HOME（同一个 runner
          # 用户），而这个 action 默认装到固定的 `~/setup-pnpm`。并发 job（tag 时
          # publish 与两格 smoke 同时跑）会互相删掉对方正 cd 着的目录，症状是
          # `ENOENT: process.cwd failed ... directory was likely removed`
          # （2026-08-14 v0.2.38 发版实锤：node20 格过、node24 格挂）。
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Build very-happy-cli
        run: pnpm --filter very-happy-cli build

      - name: Verify wire is bundled (no external @slopus/happy-wire import)
        shell: bash
        run: |
          if grep -rnE "(import|require|from)[^\n]*['\"]@slopus/happy-wire['\"]" packages/happy-cli/dist; then
            echo "ERROR: dist still imports @slopus/happy-wire externally; bundle failed." >&2
            exit 1
          fi
          echo "OK: @slopus/happy-wire is inlined into dist."

      - name: Pack + global install (runs postinstall on this platform)
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_NAME=$(node -e "process.stdout.write(require('./packages/happy-cli/scripts/unpack-tools.cjs').getPlatformPackageName())")
          pnpm --filter "$TOOLS_NAME" pack --pack-destination packages/happy-cli
          pnpm --filter very-happy-cli pack --pack-destination packages/happy-cli
          TOOLS_PKG=$(ls packages/happy-cli/"$TOOLS_NAME"-*.tgz)
          CLI_PKG=$(ls packages/happy-cli/very-happy-cli-*.tgz)
          CLI_BYTES=$(wc -c < "$CLI_PKG")
          test "$CLI_BYTES" -lt 10000000 || { echo "FAIL: main CLI tarball is $CLI_BYTES bytes"; exit 1; }
          npm install -g "./$TOOLS_PKG" "./$CLI_PKG"

      - name: Run very-happy subcommands
        shell: bash
        env:
          HAPPY_HOME_DIR: ${{ runner.temp }}/happy-home
        run: |
          set -euo pipefail
          # macOS 没有 GNU `timeout`（历史上两个矩阵格子因此秒挂），perl alarm 等价。
          if ! command -v timeout >/dev/null 2>&1; then
            timeout() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          fi
          echo "very-happy --version"
          timeout 30 very-happy --version || { echo "FAIL: --version"; exit 1; }
          echo "very-happy --help"
          timeout 30 very-happy --help || { echo "FAIL: --help"; exit 1; }
          echo "very-happy doctor"
          timeout 60 very-happy doctor || { echo "FAIL: doctor"; exit 1; }
          echo "Smoke test passed on macos-14 (node ${{ matrix.node-version }})"

      - name: Cleanup global install
        if: always()
        shell: bash
        run: |
          TOOLS_NAME=$(node -e "process.stdout.write(require('./packages/happy-cli/scripts/unpack-tools.cjs').getPlatformPackageName())")
          npm uninstall -g very-happy-cli "$TOOLS_NAME" || true

  # ── Windows：**只在手动勾 cross_platform 时跑**，托管 runner（会计费）──────
  # B-148 起不再挂在 tag 上。理由不是「Windows 不重要」，而是它挂在 tag 上时
  # 从 v0.2.44 起就没真跑过（hosted job 2 秒失败），只是稳定产出一个所有人都
  # 学会忽略的红叉。要恢复常态覆盖，二选一：给仓库开够 hosted 额度，或者接一台
  # Windows self-hosted runner。在那之前请如实认账：**Windows 没有常态覆盖**。
  # postinstall 确实有 win32 分支（unpack-tools.cjs 的 x64-win32/arm64-win32、
  # ripgrep_launcher 的 where/rg、difft.exe、query_engine-windows.dll.node），
  # 所以改动碰到这些文件时，务必手动跑一次：
  #   gh workflow run cli-smoke-test.yml -f cross_platform=true
  smoke-windows:
    name: smoke (windows-latest, node ${{ matrix.node-version }})
    if: ${{ inputs.cross_platform && vars.SKIP_HOSTED_SMOKE != '1' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 托管 runner 上 node/npm 是预装的，所以维持 pnpm → setup-node 的顺序，
      # 好处是能开 `cache: pnpm`。
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Build very-happy-cli
        run: pnpm --filter very-happy-cli build

      - name: Verify wire is bundled (no external @slopus/happy-wire import)
        shell: bash
        run: |
          if grep -rnE "(import|require|from)[^\n]*['\"]@slopus/happy-wire['\"]" packages/happy-cli/dist; then
            echo "ERROR: dist still imports @slopus/happy-wire externally; bundle failed." >&2
            exit 1
          fi
          echo "OK: @slopus/happy-wire is inlined into dist."

      - name: Pack + global install (runs postinstall on this platform)
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_NAME=$(node -e "process.stdout.write(require('./packages/happy-cli/scripts/unpack-tools.cjs').getPlatformPackageName())")
          pnpm --filter "$TOOLS_NAME" pack --pack-destination packages/happy-cli
          pnpm --filter very-happy-cli pack --pack-destination packages/happy-cli
          TOOLS_PKG=$(ls packages/happy-cli/"$TOOLS_NAME"-*.tgz)
          CLI_PKG=$(ls packages/happy-cli/very-happy-cli-*.tgz)
          CLI_BYTES=$(wc -c < "$CLI_PKG")
          test "$CLI_BYTES" -lt 10000000 || { echo "FAIL: main CLI tarball is $CLI_BYTES bytes"; exit 1; }
          npm install -g "./$TOOLS_PKG" "./$CLI_PKG"

      - name: Run very-happy subcommands
        shell: bash
        env:
          HAPPY_HOME_DIR: ${{ runner.temp }}/happy-home
        run: |
          echo "very-happy --version"
          timeout 30 very-happy --version || { echo "FAIL: --version"; exit 1; }
          echo "very-happy --help"
          timeout 30 very-happy --help || { echo "FAIL: --help"; exit 1; }
          echo "very-happy doctor"
          timeout 60 very-happy doctor || { echo "FAIL: doctor"; exit 1; }
          echo "Smoke test passed on windows-latest (node ${{ matrix.node-version }})"

      - name: Cleanup global install
        if: always()
        shell: bash
        run: |
          TOOLS_NAME=$(node -e "process.stdout.write(require('./packages/happy-cli/scripts/unpack-tools.cjs').getPlatformPackageName())")
          npm uninstall -g very-happy-cli "$TOOLS_NAME" || true
