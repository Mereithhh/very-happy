<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Very Happy</title>
    <meta name="description" content="Your coding agent hub: connect computers, agents, conversations, and real terminals in one workspace. Work from anywhere, on your own or with Teams." />
    <!-- browser chrome tint follows the theme: dark bg-0 / light bg-0 -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111210" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f1" />
    <meta name="theme-color" content="#111210" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Very Happy" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Link-preview cards (Tanka/IM link unfurls). og:image must be absolute. -->
    <meta property="og:title" content="Very Happy — Every machine. Every agent. Anywhere." />
    <meta property="og:description" content="One hub for your connected machines and coding agents. Pick up work from any screen, and use Teams to coordinate parallel tasks." />
    <meta property="og:image" content="https://veryhappy.dev/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- vh-startup-style -->
  </head>
  <body>
    <div id="vh-splash">
      <div class="vh-startup" role="status" aria-label="Loading workspace" aria-live="polite">
        <div><!-- vh-startup-artwork --></div>
        <strong class="vh-startup-wordmark">Very Happy</strong>
        <p class="vh-startup-caption" aria-hidden="true"><span class="vh-startup-dot"></span>Loading workspace</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
