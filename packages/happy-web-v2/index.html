<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Very Happy</title>
    <meta name="description" content="An open agent workspace for your machines. Work anywhere and keep the thread." />
    <!-- browser chrome tint follows the theme: dark bg-0 / light bg-0 -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06080c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8eaed" />
    <meta name="theme-color" content="#06080c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Very Happy" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Link-preview cards (Tanka/IM link unfurls). og:image must be absolute. -->
    <meta property="og:title" content="Very Happy — Work anywhere. Keep the thread." />
    <meta property="og:description" content="Coding agents, terminals, files, tasks, and a voice-ready meta-agent in one open workspace." />
    <meta property="og:image" content="https://happy.mereith.com/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* pre-paint splash to avoid white flash before React mounts */
      #vh-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #06080c;
        z-index: 9999;
        transition: opacity 0.25s ease;
      }
      @media (prefers-color-scheme: light) {
        /* light bg-0 + light accent (tokens.css) — the splash pre-paints
           before the stylesheet loads, so the values are inlined */
        #vh-splash { background: #e8eaed; }
        #vh-splash .mark { border-color: #0c8a76; }
      }
      #vh-splash .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 2px solid #34e2c4;
        animation: vh-pulse 1.4s ease-in-out infinite;
      }
      @keyframes vh-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #vh-splash .mark { animation: none; opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div id="vh-splash"><div class="mark"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
