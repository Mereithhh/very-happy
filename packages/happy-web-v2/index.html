    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8eaed" />

    <meta property="og:title" content="Very Happy — One panel. Every machine. Every agent." />
    <meta property="og:description" content="See the fleet, dispatch work, and step into agents, real terminals, files, and tasks from one open Web workspace." />
    <meta property="og:image" content="https://veryhappy.dev/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* pre-paint splash to avoid white flash before React mounts */
      #vh-splash {
        --vh-splash-bg: #06080c;
        --vh-splash-panel: #0e141b;
        --vh-splash-raised: #181f2a;
        --vh-splash-line: #2c3543;
        --vh-splash-text: #e8edf4;
        --vh-splash-dim: #9aa4b2;
        --vh-splash-faint: #5b6675;
        --vh-splash-live: #34e2c4;
        --vh-splash-live-dim: rgba(52, 226, 196, 0.16);
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--vh-splash-bg);
        z-index: 9999;
        transition: opacity 0.32s ease;
        isolation: isolate;
      }
      #vh-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--vh-splash-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--vh-splash-line) 1px, transparent 1px);
        background-size: 44px 44px;
        opacity: 0.14;
        mask-image: radial-gradient(circle at center, black, transparent 72%);
      }
      @media (prefers-color-scheme: light) {
        /* light bg-0 + light accent (tokens.css) — the splash pre-paints
           before the stylesheet loads, so the values are inlined */
        #vh-splash {
          --vh-splash-bg: #e8eaed;
          --vh-splash-panel: #eff1f4;
          --vh-splash-raised: #f6f7f9;
          --vh-splash-line: #c2c8d1;
          --vh-splash-text: #1a2028;
          --vh-splash-dim: #49535f;
          --vh-splash-faint: #5b646f;
          --vh-splash-live: #0c8a76;
          --vh-splash-live-dim: rgba(12, 138, 118, 0.18);
        }
      }
      .vh-orbit-loader {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 8px;
        color: var(--vh-splash-text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .vh-orbit-viewport {
        position: relative;
        width: 234px;
        height: 234px;
      }
      .vh-orbit-stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 324px;
        height: 324px;
        transform: translate(-50%, -50%) scale(0.72);
      }
      .vh-orbit-stage::before,
      .vh-orbit-stage::after {
        content: '';
        position: absolute;
        inset: 80px;
        border: 1px solid var(--vh-splash-line);
        border-radius: 50%;
      }
      .vh-orbit-stage::after {
        inset: 112px;
        border-style: dashed;
        opacity: 0.72;
      }
      .vh-orbit-track {
        position: absolute;
        inset: 80px;
        border-radius: 50%;
        animation: vh-orbit 8.4s linear infinite;
      }
      .vh-orbit-track::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        background: conic-gradient(from 225deg, transparent 0 76%, var(--vh-splash-live) 86%, transparent 92%);
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), black calc(100% - 1px));
        opacity: 0.8;
      }
      .vh-model-track {
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        animation: vh-model-orbit 19s linear infinite;
      }
      .vh-model-track::before,
      .vh-model-track::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
      }
      .vh-model-track::before {
        border: 1px dashed var(--vh-splash-line);
        opacity: 0.5;
      }
      .vh-model-track::after {
        inset: -1px;
        background: conic-gradient(from 40deg, transparent 0 86%, var(--vh-splash-live) 93%, transparent 98%);
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), black calc(100% - 1px));
        opacity: 0.62;
      }
      .vh-model {
        position: absolute;
        width: 38px;
        height: 38px;
      }
      .vh-model--anthropic { left: 50%; top: 0; transform: translate(-50%, -50%); }
      .vh-model--llama { left: 97.55%; top: 34.55%; transform: translate(-50%, -50%); }
      .vh-model--deepseek { left: 79.39%; top: 90.45%; transform: translate(-50%, -50%); }
      .vh-model--qwen { left: 20.61%; top: 90.45%; transform: translate(-50%, -50%); }
      .vh-model--mistral { left: 2.45%; top: 34.55%; transform: translate(-50%, -50%); }
      .vh-model--anthropic { --vh-model-color: #d97757; }
      .vh-model--llama { --vh-model-color: #0467df; }
      .vh-model--deepseek { --vh-model-color: #5786fe; }
      .vh-model--qwen { --vh-model-color: #6950ef; }
      .vh-model--mistral { --vh-model-color: #fa520f; }
      .vh-model-glyph {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        border: 1px solid var(--vh-splash-line);
        border-radius: 11px;
        color: var(--vh-model-color);
        background: var(--vh-splash-panel);
        opacity: 0.88;
        animation: vh-model-counter-orbit 19s linear infinite;
      }
      .vh-model-glyph svg { width: 18px; height: 18px; }
      .vh-agent {
        position: absolute;
        width: 46px;
        height: 46px;
      }
      .vh-agent--claude { left: 50%; top: 0; transform: translate(-50%, -50%); }
      .vh-agent--codex { left: 93.3%; top: 75%; transform: translate(-50%, -50%); }
      .vh-agent--gemini { left: 6.7%; top: 75%; transform: translate(-50%, -50%); }
      .vh-agent-face {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        gap: 2px;
        border: 1px solid var(--vh-splash-line);
        border-radius: 10px;
        background: var(--vh-splash-panel);
        animation: vh-counter-orbit 8.4s linear infinite;
      }
      .vh-agent-face svg {
        width: 22px;
        height: 22px;
        color: var(--vh-splash-text);
      }
      .vh-agent-face span {
        color: var(--vh-splash-dim);
        font-size: 8px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .vh-orbit-core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 60px;
        height: 60px;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        border: 1px solid var(--vh-splash-line);
        border-radius: 15px;
        background: var(--vh-splash-raised);
      }
      .vh-orbit-core::before {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 20px;
        background: conic-gradient(transparent 0 78%, var(--vh-splash-live));
        mask: linear-gradient(black 0 0) content-box, linear-gradient(black 0 0);
        mask-composite: exclude;
        padding: 1px;
        animation: vh-scan 2.6s linear infinite;
      }
      .vh-orbit-core svg { width: 34px; height: 34px; }
      .vh-orbit-core .vh-live-dot {
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--vh-splash-live);
        box-shadow: 0 0 0 5px var(--vh-splash-live-dim);
        animation: vh-live-pulse 1.3s ease-in-out infinite;
      }
      .vh-orbit-wordmark {
        display: contents;
      }
      .vh-orbit-wordmark strong {
        color: var(--vh-splash-text);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.22em;
        line-height: 1;
        text-transform: lowercase;
      }
      .vh-orbit-wordmark span {
        color: var(--vh-splash-faint);
        font-size: 10px;
        letter-spacing: 0.14em;
        line-height: 1.4;
        text-align: center;
        text-transform: uppercase;
      }
      @keyframes vh-orbit { to { transform: rotate(360deg); } }
      @keyframes vh-counter-orbit { to { transform: rotate(-360deg); } }
      @keyframes vh-model-orbit { to { transform: rotate(-360deg); } }
      @keyframes vh-model-counter-orbit { to { transform: rotate(360deg); } }
      @keyframes vh-scan { to { transform: rotate(360deg); } }
      @keyframes vh-live-pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.82); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .vh-model-track,
        .vh-model-glyph,
        .vh-orbit-track,
        .vh-agent-face,
        .vh-orbit-core::before,
        .vh-orbit-core .vh-live-dot { animation: none; }
      }
    </style>
  </head>
