<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Session RPC and normalized event data flow</title>
  <desc id="desc">A browser session command travels through the relay to a selected machine and runner, while normalized events return through persisted sync state to all connected browsers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071116"/><stop offset="1" stop-color="#0a151c"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#72ffe2"/><stop offset="1" stop-color="#18bca7"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b5aeff"/><stop offset="1" stop-color="#776fe3"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#9ab5bb" stroke-opacity=".055"/></pattern>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#43f5d0"/></marker>
    <marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9189ef"/></marker>
    <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.title{font:700 34px ui-sans-serif,system-ui,sans-serif;fill:#effffc}.eyebrow{font-size:14px;letter-spacing:3px;fill:#43f5d0}.head{font-size:19px;font-weight:700;fill:#effffc}.body{font-size:14px;fill:#9bb0b5}.code{font-size:13px;fill:#d9f8f1}.dim{font-size:12px;fill:#6f898f}.lane{stroke:#38515a;stroke-dasharray:5 9}.request{fill:none;stroke:#43f5d0;stroke-width:3;marker-end:url(#a)}.event{fill:none;stroke:#9189ef;stroke-width:3;marker-end:url(#p)}</style>
  </defs>
  <rect width="1600" height="980" rx="30" fill="url(#bg)"/><rect width="1600" height="980" rx="30" fill="url(#grid)"/>
  <text x="64" y="66" class="eyebrow">SESSION LIFECYCLE / BIDIRECTIONAL DATA PLANE</text>
  <text x="64" y="112" class="title">Commands go down. Normalized events come back up.</text>
  <text x="64" y="144" class="body">The relay routes by account + machine; adapters contain provider differences at the execution edge.</text>

  <g>
    <rect x="70" y="200" width="250" height="82" rx="16" fill="#12232c" stroke="#39515a"/><circle cx="103" cy="241" r="9" fill="#9189ef" filter="url(#glow)"/><text x="126" y="236" class="head">Web V2 / PWA</text><text x="126" y="258" class="dim">React workspace</text>
    <rect x="440" y="200" width="250" height="82" rx="16" fill="#0f292c" stroke="#43f5d0"/><circle cx="473" cy="241" r="9" fill="#43f5d0" filter="url(#glow)"/><text x="496" y="236" class="head">server planes</text><text x="496" y="258" class="dim">control + regional relay</text>
    <rect x="810" y="200" width="250" height="82" rx="16" fill="#12232c" stroke="#39515a"/><circle cx="843" cy="241" r="9" fill="#43f5d0" filter="url(#glow)"/><text x="866" y="236" class="head">local daemon</text><text x="866" y="258" class="dim">selected machine</text>
    <rect x="1180" y="200" width="350" height="82" rx="16" fill="#181f30" stroke="#7067db"/><circle cx="1213" cy="241" r="9" fill="#9189ef" filter="url(#glow)"/><text x="1236" y="236" class="head">runner adapter</text><text x="1236" y="258" class="dim">Claude · Codex · ACP · OpenClaw · TTY</text>
    <path d="M195 282V898M565 282V898M935 282V898M1355 282V898" class="lane"/>
  </g>

  <text x="70" y="333" class="eyebrow">01 / COMMAND PATH</text>
  <path d="M195 368H565" class="request"/><rect x="252" y="342" width="256" height="48" rx="12" fill="#10292d" stroke="#2d5f5b"/><text x="268" y="371" class="code">machineSpawnNewSession(options)</text>
  <path d="M565 430H935" class="request"/><rect x="598" y="404" width="304" height="48" rx="12" fill="#10292d" stroke="#2d5f5b"/><text x="613" y="433" class="code">machineRPC(id, 'spawn-happy-session')</text>
  <path d="M935 492H1355" class="request"/><rect x="1015" y="466" width="260" height="48" rx="12" fill="#10292d" stroke="#2d5f5b"/><text x="1033" y="495" class="code">spawnSession({ agent, ... })</text>
  <g transform="translate(1178 538)"><rect width="354" height="112" rx="15" fill="#151f2d" stroke="#514d94"/><text x="22" y="29" class="dim">NATIVE EXECUTION</text><text x="22" y="57" class="code">SDK event | JSON-RPC | PTY bytes</text><path d="M22 72H332" stroke="#343a56"/><text x="22" y="95" class="body">capabilities stay runner-specific</text></g>

  <text x="70" y="705" class="eyebrow">02 / EVENT + SYNC PATH</text>
  <path d="M1355 738H935" class="event"/><rect x="1000" y="712" width="290" height="48" rx="12" fill="#1a2033" stroke="#554f9b"/><text x="1020" y="741" class="code">runner-specific normalization</text>
  <path d="M935 800H565" class="event"/><rect x="610" y="774" width="280" height="48" rx="12" fill="#1a2033" stroke="#554f9b"/><text x="635" y="803" class="code">shared session protocol update</text>
  <path d="M565 862H195" class="event"/><rect x="252" y="836" width="256" height="48" rx="12" fill="#1a2033" stroke="#554f9b"/><text x="274" y="865" class="code">Socket.IO fan-out</text>

  <g transform="translate(440 904)"><rect width="250" height="48" rx="14" fill="#0f292c" stroke="#43f5d0"/><text x="31" y="29" class="code">persist sync state</text></g>
  <path d="M565 862V904" stroke="#43f5d0" stroke-width="2" marker-end="url(#a)"/>
  <g transform="translate(728 904)"><rect width="430" height="48" rx="14" fill="#101f27" stroke="#344b53"/><text x="25" y="29" class="body">other signed-in browsers converge on relay state</text></g>
  <path d="M690 928H728" stroke="#637f87" stroke-width="2" marker-end="url(#a)"/>

  <g transform="translate(70 408)"><rect width="302" height="178" rx="16" fill="#0d1d24" stroke="#2d4149"/><text x="22" y="31" class="dim">ROUTING KEY</text><text x="22" y="63" class="code">{</text><text x="42" y="87" class="code">accountId,</text><text x="42" y="111" class="code">machineId,</text><text x="42" y="135" class="code">sessionId, runner</text><text x="22" y="159" class="code">}</text></g>
  <g transform="translate(440 528)"><rect width="250" height="128" rx="16" fill="#0d1d24" stroke="#2d4149"/><text x="22" y="31" class="dim">SERVER PLANES OWN</text><text x="22" y="60" class="body">identity + authorization</text><text x="22" y="84" class="body">RPC correlation</text><text x="22" y="108" class="body">durable sync (control)</text></g>
  <g transform="translate(810 548)"><rect width="250" height="108" rx="16" fill="#0d1d24" stroke="#2d4149"/><text x="22" y="31" class="dim">DAEMON OWNS</text><text x="22" y="60" class="body">process lifecycle</text><text x="22" y="84" class="body">local machine access</text></g>
</svg>
